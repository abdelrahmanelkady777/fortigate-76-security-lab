# FortiOS 7.6.7 - Branch relevant Lesson 09 state
# Sanitized reconstruction: review object/route IDs before applying.

config system interface
    edit "port1"
        set alias "ToForti"
        set ip 10.50.50.2 255.255.255.0
    next
    edit "port2"
        set alias "BRANCH-LAN"
        set ip 10.40.40.1 255.255.255.0
    next
    edit "port3"
        set mode dhcp
    next
end

config firewall address
    edit "HQ-Lan"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "Branch-Lan"
        set subnet 10.40.40.0 255.255.255.0
    next
end

config vpn ipsec phase1-interface
    edit "Branch-to-HQ"
        set interface "port1"
        set ike-version 1
        set mode main
        set peertype any
        set net-device disable
        set authmethod psk
        set proposal des-sha1
        set dhgrp 14
        set keylife 86400
        set dpd on-idle
        set nattraversal disable
        set add-route disable
        set remote-gw 10.50.50.1
        set psksecret "REPLACE_WITH_SHARED_SECRET"
    next
end

config vpn ipsec phase2-interface
    edit "BR-HQ-P2"
        set phase1name "Branch-to-HQ"
        set proposal des-sha1
        set encapsulation tunnel-mode
        set pfs enable
        set dhgrp 14
        set replay enable
        set keylifeseconds 43200
        set auto-negotiate disable
        set keepalive disable
        set src-subnet 10.40.40.0 255.255.255.0
        set dst-subnet 10.10.10.0 255.255.255.0
    next
end

config router static
    edit 0
        set dst 10.10.10.0 255.255.255.0
        set device "Branch-to-HQ"
        set distance 10
    next
end

config firewall policy
    edit 0
        set name "Branch-to-HQ"
        set srcintf "port2"
        set dstintf "Branch-to-HQ"
        set srcaddr "Branch-Lan"
        set dstaddr "HQ-Lan"
        set action accept
        set schedule "always"
        set service "PING" "HTTP"
        set logtraffic all
        set nat disable
        set utm-status disable
    next
    edit 0
        set name "HQ-to-Branch"
        set srcintf "Branch-to-HQ"
        set dstintf "port2"
        set srcaddr "HQ-Lan"
        set dstaddr "Branch-Lan"
        set action accept
        set schedule "always"
        set service "PING" "HTTP"
        set logtraffic all
        set nat disable
        set utm-status disable
    next
end
