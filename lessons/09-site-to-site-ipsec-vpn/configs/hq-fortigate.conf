# FortiOS 7.6.7 - HQ relevant Lesson 09 state
# Sanitized reconstruction: review object/route IDs before applying.

config system interface
    edit "port1"
        set alias "To-Branch"
        set ip 10.50.50.1 255.255.255.0
    next
    edit "port2"
        set alias "LAB-LAN"
        set ip 10.10.10.1 255.255.255.0
    next
    edit "port3"
        set alias "TRANSIT-R1"
        set ip 10.30.30.1 255.255.255.0
    next
end

config firewall address
    edit "HQ-LAN"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "Branch-Lan"
        set subnet 10.40.40.0 255.255.255.0
    next
end

config vpn ipsec phase1-interface
    edit "HQ-to-Branch"
        set interface "port1"
        set ike-version 1
        set mode main
        set peertype any
        set net-device disable
        set authmethod psk
        set proposal des-sha1
        set dhgrp 14
        set keylife 86400
        set dpd on-idle
        set nattraversal disable
        set add-route disable
        set remote-gw 10.50.50.2
        set psksecret "REPLACE_WITH_SHARED_SECRET"
    next
end

config vpn ipsec phase2-interface
    edit "HQ-BR-P2"
        set phase1name "HQ-to-Branch"
        set proposal des-sha1
        set encapsulation tunnel-mode
        set pfs enable
        set dhgrp 14
        set replay enable
        set keylifeseconds 43200
        set auto-negotiate disable
        set keepalive disable
        set src-subnet 10.10.10.0 255.255.255.0
        set dst-subnet 10.40.40.0 255.255.255.0
    next
end

config router static
    edit 0
        set dst 10.20.20.0 255.255.255.0
        set gateway 10.30.30.2
        set device "port3"
        set distance 10
    next
    edit 0
        set dst 10.40.40.0 255.255.255.0
        set device "HQ-to-Branch"
        set distance 10
    next
end

# Policy ID 3 was reused in the live constrained lab. These names make the
# two initiation directions explicit; FortiOS may allocate different IDs.
config firewall policy
    edit 3
        set name "HQ-LAN-to-Branch"
        set srcintf "port2"
        set dstintf "HQ-to-Branch"
        set srcaddr "HQ-LAN"
        set dstaddr "Branch-Lan"
        set action accept
        set schedule "always"
        set service "PING" "HTTP"
        set logtraffic all
        set nat disable
        set utm-status disable
        unset groups
    next
    edit 0
        set name "Branch-to-HQ-LAN"
        set srcintf "HQ-to-Branch"
        set dstintf "port2"
        set srcaddr "Branch-Lan"
        set dstaddr "HQ-LAN"
        set action accept
        set schedule "always"
        set service "PING" "HTTP"
        set logtraffic all
        set nat disable
        set utm-status disable
    next
end
