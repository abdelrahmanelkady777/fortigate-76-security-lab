# Branch additions to Lesson 09. Existing Branch-to-HQ Phase 1 stays unchanged.
# Extend both existing VPN policies using the address table in README.md.
# DES-SHA1 is an isolated low-encryption evaluation setting only.

config firewall address
    edit "ALPINE-LOOPBACK"
        set subnet 10.60.60.100 255.255.255.255
    next
end

config vpn ipsec phase2-interface
    edit "BR-HQ-LO-P2"
        set phase1name "Branch-to-HQ"
        set proposal des-sha1
        set encapsulation tunnel-mode
        set pfs enable
        set dhgrp 14
        set replay enable
        set keylifeseconds 43200
        set auto-negotiate disable
        set keepalive disable
        set src-subnet 10.60.60.100 255.255.255.255
        set dst-subnet 10.10.10.0 255.255.255.0
    next
end

# REFERENCE DEFINITION: update the matching route if it already exists.
# edit 0 creates a new route; do not repeat it to modify an existing entry.
config router static
    edit 0
        set dst 10.60.60.100 255.255.255.255
        set gateway 10.40.40.100
        set device "port2"
        set distance 10
    next
end

# Retain the existing route: 10.10.10.0/24 via Branch-to-HQ.
