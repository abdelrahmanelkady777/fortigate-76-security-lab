# HQ feature reference; read README.md before applying sections.
# Inherits Lesson 09 interfaces and HQ-to-Branch Phase 1; no PSK included.
# DES-SHA1 is an isolated low-encryption evaluation setting only.

config firewall address
    edit "ALPINE-LOOPBACK"
        set subnet 10.60.60.100 255.255.255.255
    next
end

config vpn ipsec phase2-interface
    edit "HQ-BR-LO-P2"
        set phase1name "HQ-to-Branch"
        set proposal des-sha1
        set encapsulation tunnel-mode
        set pfs enable
        set dhgrp 14
        set replay enable
        set keylifeseconds 43200
        set auto-negotiate disable
        set keepalive disable
        set src-subnet 10.10.10.0 255.255.255.0
        set dst-subnet 10.60.60.100 255.255.255.255
    next
end

# Create zones first. Migrate direct references before enrolling members.
config system sdwan
    set status enable
    config zone
        edit "UNDERLAY"
        next
        edit "OVERLAY"
        next
    end
end

# Changes to the three existing HQ policies, not new policy definitions.
# Preserve other existing settings (action, schedule, services, logging).
config firewall policy
    edit 3
        set srcintf "port2"
        set dstintf "OVERLAY"
        set srcaddr "HQ-LAN"
        set dstaddr "Branch-Lan" "ALPINE-LOOPBACK"
        set nat disable
    next
    edit 2
        set srcintf "OVERLAY"
        set dstintf "port2"
        set srcaddr "Branch-Lan" "ALPINE-LOOPBACK"
        set dstaddr "HQ-LAN"
        set nat disable
    next
    edit 4
        set srcintf "port2"
        set dstintf "UNDERLAY"
        set srcaddr "HQ-LAN"
        set dstaddr "ALPINE-LOOPBACK"
        set nat enable
    next
end

# Before this section, release the old direct route/interface references.
# Zone-based route definitions are shown separately below.
config system sdwan
    config members
        edit 1
            set interface "port3"
            set zone "UNDERLAY"
            set gateway 10.30.30.2
            set cost 0
            set source 10.30.30.1
        next
        edit 2
            set interface "HQ-to-Branch"
            set zone "OVERLAY"
            set gateway 0.0.0.0
            set cost 0
            set source 10.10.10.1
        next
    end
end

# REFERENCE DEFINITIONS: use the existing destination's route ID when updating.
# edit 0 allocates a new entry; do not append duplicates to an existing setup.
# These replace the direct-interface routes, not supplement them.
config router static
    edit 0
        set dst 10.40.40.0 255.255.255.0
        set distance 1
        set sdwan-zone "OVERLAY"
    next
    edit 0
        set dst 10.60.60.100 255.255.255.255
        set distance 1
        set sdwan-zone "UNDERLAY" "OVERLAY"
    next
end

# The same manual rule was tested in both orders:
# overlay-first: priority-members 2 1
# routed-path-first (shown): priority-members 1 2
# Keep the existing descriptive name of rule 1.
config system sdwan
    config service
        edit 1
            set mode manual
            set src "HQ-LAN"
            set dst "ALPINE-LOOPBACK"
            set priority-members 1 2
        next
    end
    config health-check
        edit "ALPINELOOPBACKSLA"
            set server "10.60.60.100"
            set detect-mode active
            set protocol ping
            set members 1 2
            set interval 500
            set failtime 5
            set recoverytime 5
            set update-static-route enable
            config sla
                edit 1
                    set latency-threshold 30
                    set jitter-threshold 10
                    set packetloss-threshold 10
                next
            end
        next
    end
end
